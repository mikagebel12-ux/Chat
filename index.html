<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatroom</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#e8edf4;--panel:#fff;--line:#d3dbe7;--text:#1b2433;--mute:#69758a;--acc:#2f5bea;--accfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--panel:#1a2230;--line:#2a3447;--text:#e6ebf4;--mute:#8b97ad;--acc:#6f93ff;--accfg:#0b1020}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea{width:100%;padding:.65rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.btn{background:var(--acc);color:var(--accfg);padding:.7rem 1.1rem;border-radius:10px;font-weight:600}
.btn.sec{background:none;color:var(--text);border:1px solid var(--line)}
#auth{min-height:100%;display:grid;place-items:center;padding:1rem}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.5rem;display:grid;gap:.9rem}
.card h1{font-size:1.5rem}
.card p{color:var(--mute);font-size:.9rem}
#tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#tabs button{flex:1;padding:.55rem;color:var(--mute)}
#tabs button.on{background:var(--acc);color:var(--accfg);font-weight:600}
label{display:grid;gap:.25rem;font-size:.85rem;color:var(--mute)}
#amsg{font-size:.9rem;color:#d23f3f;min-height:1.2em}
#amsg.ok{color:#238a4b}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
header{padding:.8rem 1rem .6rem;border-bottom:1px solid var(--line);background:var(--panel)}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.55rem}
.top b{font-size:1.1rem}
.top span{color:var(--mute);font-size:.85rem}
#seats{display:flex;gap:.4rem;justify-content:space-between}
.seat{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;border:2px dashed var(--line);flex:none}
.seat.on{border:2px solid var(--panel);box-shadow:0 0 0 2px var(--line)}
.seat.me{box-shadow:0 0 0 2px var(--acc)}
#msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.empty{margin:auto;color:var(--mute);text-align:center}
.row{display:flex;gap:.5rem;align-items:flex-end;max-width:85%}
.row.mine{align-self:flex-end;flex-direction:row-reverse}
.av{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;flex:none;font-size:1.05rem}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:.45rem .75rem;min-width:0}
.mine .bub{background:var(--acc);color:var(--accfg);border-color:var(--acc);border-radius:16px 16px 4px 16px}
.meta{display:flex;gap:.5rem;font-size:.75rem;color:var(--mute)}
.meta b{font-weight:600}
.mine .meta{color:inherit;opacity:.8}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
#send{display:flex;gap:.5rem;padding:.7rem 1rem;border-top:1px solid var(--line);background:var(--panel)}
#in{flex:1}
.pic{display:block;max-width:100%;max-height:300px;border-radius:10px;margin-top:.3rem;cursor:zoom-in;background:var(--line)}
.clip{display:grid;place-items:center;padding:.7rem .8rem;cursor:pointer}
dialog{margin:auto;width:min(92vw,360px);border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:1.3rem}
dialog::backdrop{background:rgba(8,12,20,.55)}
dialog form{display:grid;gap:.8rem}
#pav{width:4rem;height:4rem;font-size:2rem;justify-self:center}
#em{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center}
#em button{width:2.2rem;height:2.2rem;border-radius:50%;font-size:1.2rem;border:2px solid transparent}
#em button.on{border-color:var(--acc)}
#pc{height:2.6rem;padding:.2rem}
.acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body>

<section id="auth">
  <form class="card" id="authform">
    <h1>Chatroom</h1>
    <p>Privater Raum für bis zu 10 Personen.</p>
    <div id="tabs"><button type="button" class="on" data-m="login">Einloggen</button><button type="button" data-m="signup">Registrieren</button></div>
    <label id="uwrap" hidden>Anzeigename<input id="uname" maxlength="20" autocomplete="nickname"></label>
    <label>E-Mail<input id="email" type="email" required autocomplete="email"></label>
    <label>Passwort<input id="pw" type="password" required minlength="6" autocomplete="current-password"></label>
    <div id="amsg" role="alert"></div>
    <button class="btn" id="go">Einloggen</button>
  </form>
</section>

<main id="app" hidden>
  <header>
    <div class="top"><b>Chatroom</b><span id="count"></span></div>
    <div id="seats" aria-label="Mitglieder"></div>
  </header>
  <div id="msgs" aria-live="polite"></div>
  <form id="send">
    <label class="btn sec clip" title="Bild senden" aria-label="Bild senden">📎<input type="file" id="file" accept="image/*" hidden></label>
    <input id="in" maxlength="500" placeholder="Nachricht schreiben" autocomplete="off" aria-label="Nachricht">
    <button class="btn">Senden</button>
  </form>
</main>

<dialog id="dlg">
  <form onsubmit="return false">
    <div class="av" id="pav"></div>
    <label>Anzeigename<input id="pu" maxlength="20"></label>
    <div id="em"></div>
    <label>Farbe<input id="pc" type="color"></label>
    <label>Über mich<textarea id="pb" rows="2" maxlength="160"></textarea></label>
    <div id="perr" style="color:#d23f3f;font-size:.9rem"></div>
    <div class="acts">
      <button type="button" class="btn sec" id="plogout">Ausloggen</button>
      <button type="button" class="btn sec" id="pclose">Schließen</button>
      <button type="button" class="btn" id="psave">Speichern</button>
    </div>
  </form>
</dialog>

<script>
// 1) Hier deine Supabase-Daten eintragen (Project Settings > API)
const SUPABASE_URL = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91emdjZnBmanZocHBuaWltbndrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTU0MzcsImV4cCI6MjEwNjgzMTQzN30.aFr7XtY3n8lwnn93_SmvuZrI-pCH3aqgS9KbHPMpC7I';
const SUPABASE_KEY = 'https://ouzgcfpfjvhppniimnwk.supabase.co';

const $ = s => document.querySelector(s);
let sb;
function fail(t) { $('#amsg').textContent = t; $('#go').disabled = true; }
if (typeof supabase === 'undefined') fail('Die Supabase-Bibliothek konnte nicht geladen werden. Öffne die Datei direkt im Browser (nicht in einer Vorschau) und prüfe die Internetverbindung.');
else if (!/^https?:\/\//.test(SUPABASE_URL) || SUPABASE_KEY.startsWith('DEIN')) fail('Trage oben in der index.html deine Supabase-URL und den anon key ein.');
else sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const EMOJIS = ['🙂','😎','🤓','🦊','🐼','🐙','🦄','🔥','🌵','🚀','🎧','🍕'];
let me = null, profiles = {}, seen = new Set(), mode = 'login', entering = false, pick = '🙂';

function amsg(t, ok) { $('#amsg').textContent = t || ''; $('#amsg').className = ok ? 'ok' : ''; }
const time = d => new Date(d).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

/* ---------- Login ---------- */
$('#tabs').onclick = e => {
  const m = e.target.dataset.m; if (!m) return;
  mode = m; amsg('');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#uwrap').hidden = m === 'login';
  $('#go').textContent = m === 'login' ? 'Einloggen' : 'Konto erstellen';
  $('#pw').autocomplete = m === 'login' ? 'current-password' : 'new-password';
};

$('#authform').onsubmit = async e => {
  e.preventDefault(); if (!sb) return; amsg('');
  const email = $('#email').value.trim(), password = $('#pw').value;
  if (mode === 'login') {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) amsg(error.message.includes('Invalid') ? 'E-Mail oder Passwort stimmt nicht.' : error.message);
  } else {
    const username = $('#uname').value.trim();
    if (username.length < 2) return amsg('Der Anzeigename braucht mindestens 2 Zeichen.');
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
    if (error) return amsg(error.message);
    if (!data.session) amsg('Konto erstellt. Bestätige den Link in deiner E-Mail und logge dich dann ein.', true);
  }
};

if (sb) sb.auth.onAuthStateChange((ev, s) => {
  setTimeout(() => { if (s) enter(s.user); else leave(); }, 0);
});

/* ---------- Chat starten / beenden ---------- */
async function enter(u) {
  if (me || entering) return;
  entering = true;
  let { data: p } = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
  if (!p) {
    const name = (u.user_metadata && u.user_metadata.username) || u.email.split('@')[0];
    const r = await sb.from('profiles').insert({ id: u.id, username: name }).select().single();
    if (r.error) {
      entering = false;
      await sb.auth.signOut();
      const m = r.error.message;
      return amsg(m.includes('row-level') ? 'Der Chatroom ist voll (maximal 10 Personen).' : m.includes('duplicate') ? 'Dieser Anzeigename ist schon vergeben.' : m);
    }
    p = r.data;
  }
  me = p;
  await loadProfiles();
  $('#auth').hidden = true; $('#app').hidden = false;
  const { data: m } = await sb.from('messages').select('*').order('created_at', { ascending: false }).limit(100);
  $('#msgs').replaceChildren(); seen.clear();
  (m || []).reverse().forEach(add);
  if (!seen.size) $('#msgs').append(el('div', 'empty', 'Noch keine Nachrichten. Schreib die erste.'));
  scroll(true);
  sb.channel('room')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async pl => {
      if (!profiles[pl.new.user_id]) await loadProfiles();
      add(pl.new); scroll();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, async () => { await loadProfiles(); redraw(); })
    .subscribe();
  entering = false;
}

function leave() {
  me = null; entering = false; profiles = {};
  sb.removeAllChannels();
  $('#app').hidden = true; $('#auth').hidden = false;
  if ($('#dlg').open) $('#dlg').close();
}

async function loadProfiles() {
  const { data } = await sb.from('profiles').select('*').order('username');
  profiles = Object.fromEntries((data || []).map(p => [p.id, p]));
  if (me && profiles[me.id]) me = profiles[me.id];
  seats();
}

/* ---------- Mitglieder-Leiste ---------- */
function seats() {
  const box = $('#seats'), list = Object.values(profiles);
  box.replaceChildren();
  for (let i = 0; i < 10; i++) {
    const p = list[i], s = el('button', 'seat' + (p ? ' on' : '') + (p && me && p.id === me.id ? ' me' : ''), p ? p.emoji : '');
    if (p) { s.style.background = p.color; s.title = p.username; s.onclick = () => show(p.id); }
    else { s.disabled = true; s.setAttribute('aria-label', 'Freier Platz'); }
    box.append(s);
  }
  $('#count').textContent = list.length + ' von 10 Plätzen belegt';
}

/* ---------- Nachrichten ---------- */
const urls = {};
async function imgUrl(p) {
  if (!urls[p]) { const { data } = await sb.storage.from('chat-images').createSignedUrl(p, 86400); urls[p] = data && data.signedUrl; }
  return urls[p];
}
function row(m) {
  const p = profiles[m.user_id] || { username: '?', emoji: '🙂', color: '#8b97ad' };
  const r = el('div', 'row' + (me && m.user_id === me.id ? ' mine' : ''));
  const av = el('button', 'av', p.emoji); av.style.background = p.color; av.onclick = () => show(m.user_id);
  const meta = el('div', 'meta'); meta.append(el('b', null, p.username), el('span', null, time(m.created_at)));
  const b = el('div', 'bub'); b.append(meta);
  if (m.text) b.append(el('div', 'txt', m.text));
  if (m.image_path) {
    const im = el('img', 'pic'); im.alt = 'Bild';
    im.onload = () => { if (!r.nextSibling) scroll(true); };
    im.onclick = () => window.open(im.src, '_blank');
    imgUrl(m.image_path).then(u => { if (u) im.src = u; });
    b.append(im);
  }
  r.append(av, b); r._m = m;
  return r;
}
function add(m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const box = $('#msgs'); box.querySelector('.empty')?.remove();
  box.append(row(m));
}
function redraw() { [...$('#msgs').children].forEach(r => r._m && r.replaceWith(row(r._m))); }
function scroll(force) {
  const b = $('#msgs');
  if (force || b.scrollHeight - b.scrollTop - b.clientHeight < 140) b.scrollTop = b.scrollHeight;
}

$('#send').onsubmit = async e => {
  e.preventDefault();
  const t = $('#in').value.trim(); if (!t) return;
  $('#in').value = '';
  const { data, error } = await sb.from('messages').insert({ text: t }).select().single();
  if (error) { $('#in').value = t; return alert('Senden fehlgeschlagen: ' + error.message); }
  add(data); scroll(true);
};

/* ---------- Bilder senden ---------- */
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const cap = $('#in').value.trim();
  try {
    const bmp = await createImageBitmap(f), s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    const path = me.id + '/' + Date.now() + '.jpg';
    const up = await sb.storage.from('chat-images').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) throw up.error;
    const { data, error } = await sb.from('messages').insert({ text: cap, image_path: path }).select().single();
    if (error) throw error;
    $('#in').value = ''; add(data); scroll(true);
  } catch (err) { alert('Bild senden fehlgeschlagen: ' + (err.message || 'Format nicht unterstützt')); }
};

/* ---------- Profil ---------- */
function emojis() {
  $('#em').replaceChildren();
  EMOJIS.forEach(x => {
    const b = el('button', x === pick ? 'on' : '', x); b.type = 'button';
    b.onclick = () => { pick = x; $('#pav').textContent = x; emojis(); };
    $('#em').append(b);
  });
}
function show(id) {
  const p = profiles[id]; if (!p) return;
  const own = me && id === me.id;
  pick = p.emoji;
  $('#pu').value = p.username; $('#pc').value = p.color; $('#pb').value = p.bio || '';
  $('#pav').textContent = p.emoji; $('#pav').style.background = p.color; $('#perr').textContent = '';
  ['#pu', '#pc', '#pb'].forEach(s => $(s).disabled = !own);
  $('#pb').placeholder = own ? 'Ein, zwei Sätze über dich' : 'Keine Beschreibung';
  $('#em').hidden = !own; $('#psave').hidden = !own; $('#plogout').hidden = !own;
  if (own) emojis();
  $('#dlg').showModal();
}
$('#pc').oninput = () => $('#pav').style.background = $('#pc').value;
$('#pclose').onclick = () => $('#dlg').close();
$('#plogout').onclick = () => sb.auth.signOut();
$('#psave').onclick = async () => {
  const username = $('#pu').value.trim();
  if (username.length < 2) return $('#perr').textContent = 'Der Anzeigename braucht mindestens 2 Zeichen.';
  const { error } = await sb.from('profiles').update({ username, emoji: pick, color: $('#pc').value, bio: $('#pb').value.trim() }).eq('id', me.id);
  if (error) return $('#perr').textContent = error.message.includes('duplicate') ? 'Dieser Anzeigename ist schon vergeben.' : error.message;
  await loadProfiles(); redraw(); $('#dlg').close();
};
</script>
</body>
</html>
